<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init();
        });

        const SCALE = 14;
        let particles = [];
        let frame = 0;

        class Particle {
            constructor(x, y, delay) {
                this.x = x;
                this.y = y;
                this.delay = delay;
                this.alpha = 0;
                this.flickerPhase = Math.random() * Math.PI * 2;
                this.flicker = 1;
            }

            update() {
                if (frame > this.delay && this.alpha < 1) {
                    this.alpha = Math.min(1, this.alpha + 0.05 + Math.random() * 0.02);
                }

                if (this.alpha >= 1) {
                    this.flicker = 0.75 + 0.25 * Math.sin(frame * 0.04 + this.flickerPhase);
                } else {
                    this.flicker = 1;
                }
            }

            draw() {
                let currentAlpha = this.alpha * this.flicker;
                if (currentAlpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = '#5ac8ff';
                ctx.shadowColor = '#00aaff';
                ctx.shadowBlur = 10;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Love You', this.x, this.y);
                ctx.restore();
            }
        }

        function init() {
            particles = [];
            let placed = new Set();

            // Kalp Çerçevesi
            for (let t = 0; t < Math.PI * 2; t += 0.01) {
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                let sx = Math.round(width / 2 + x * SCALE);
                let sy = Math.round(height / 2 + y * SCALE);

                let key = `${sx},${sy}`;
                if (!placed.has(key)) {
                    placed.add(key);
                    let delay = Math.floor((y + 17) * 8 + (Math.random() * 20 - 10));
                    particles.push(new Particle(sx, sy, Math.max(0, delay)));
                }
            }

            // Kalp İçi
            for (let i = 0; i < 800; i++) {
                let t = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random());

                let x = r * 16 * Math.pow(Math.sin(t), 3);
                let y = -r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                let sx = Math.round(width / 2 + x * SCALE);
                let sy = Math.round(height / 2 + y * SCALE);

                let key = `${sx},${sy}`;
                if (!placed.has(key)) {
                    placed.add(key);
                    particles.push(new Particle(sx, sy, Math.floor(Math.random() * 320)));
                }
            }
        }

        function drawCenterText() {
            let centerStart = 200;
            if (frame > centerStart) {
                let cAlpha = Math.min(1, (frame - centerStart) * 0.015);
                let pulse = 1 + 0.05 * Math.sin(frame * 0.08);

                ctx.save();
                ctx.globalAlpha = cAlpha;
                ctx.font = `bold ${Math.round(42 * pulse)}px Arial`;
                ctx.fillStyle = '#c8f0ff';
                ctx.shadowColor = '#00d2ff';
                ctx.shadowBlur = 25;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Seviyorum Senii', width / 2, height / 2);
                ctx.restore();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            frame++;

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawCenterText();

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
    <audio autoplay loop src="sarki.mp3"></audio>
    <audio id="bgMusic" loop src="sarki.mp3"></audio>

<script>
    // Ekrana ilk dokunuşta veya tıklamada müziği başlatır
    function startAudio() {
        const audio = document.getElementById('bgMusic');
        audio.play().catch(e => console.log("Ses başlatılamadı:", e));
    }
    window.addEventListener('click', startAudio, { once: true });
    window.addEventListener('touchstart', startAudio, { once: true });
</script>
</body>
</html>
